<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão · Wapply</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #71717a;
        --accent: #16a34a;
        --border: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --fg: #e4e4e7;
          --muted: #8b8b93;
          --accent: #22c55e;
          --border: #27272a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
      }
      .card {
        max-width: 340px;
        text-align: center;
      }
      .icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 13px;
        line-height: 1.55;
        color: var(--muted);
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 8px 18px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
        </svg>
      </div>
      <h1>Você está sem conexão</h1>
      <p>
        O Wapply precisa de internet para carregar conversas e enviar mensagens. Verifique sua
        rede e tente novamente.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
